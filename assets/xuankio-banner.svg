<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">XuanKio GitHub profile banner</title>
  <desc id="desc">Dark game developer banner with pixel blocks, cards, and a glowing XuanKio title.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0d1b2d"/>
      <stop offset="1" stop-color="#10233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="56" x2="1006" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25b8ff"/>
      <stop offset="0.42" stop-color="#37d67a"/>
      <stop offset="1" stop-color="#f6c85f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 88) rotate(120) scale(292 202)">
      <stop stop-color="#25b8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#25b8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 302) rotate(-33) scale(310 160)">
      <stop stop-color="#37d67a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#37d67a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowB)"/>

  <g opacity="0.17">
    <path d="M0 70H1280" stroke="#8bb8ff"/>
    <path d="M0 140H1280" stroke="#8bb8ff"/>
    <path d="M0 210H1280" stroke="#8bb8ff"/>
    <path d="M0 280H1280" stroke="#8bb8ff"/>
    <path d="M120 0V360" stroke="#8bb8ff"/>
    <path d="M240 0V360" stroke="#8bb8ff"/>
    <path d="M360 0V360" stroke="#8bb8ff"/>
    <path d="M480 0V360" stroke="#8bb8ff"/>
    <path d="M600 0V360" stroke="#8bb8ff"/>
    <path d="M720 0V360" stroke="#8bb8ff"/>
    <path d="M840 0V360" stroke="#8bb8ff"/>
    <path d="M960 0V360" stroke="#8bb8ff"/>
    <path d="M1080 0V360" stroke="#8bb8ff"/>
    <path d="M1200 0V360" stroke="#8bb8ff"/>
  </g>

  <g opacity="0.85" filter="url(#soft)">
    <rect x="870" y="68" width="210" height="20" rx="10" fill="#25b8ff" opacity="0.28"/>
    <rect x="196" y="296" width="260" height="18" rx="9" fill="#37d67a" opacity="0.22"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="122" height="122" rx="22" fill="#0d1117" stroke="#233a59" stroke-width="2"/>
    <rect x="102" y="102" width="26" height="26" rx="5" fill="#25b8ff"/>
    <rect x="134" y="102" width="26" height="26" rx="5" fill="#37d67a"/>
    <rect x="102" y="134" width="26" height="26" rx="5" fill="#f6c85f"/>
    <rect x="134" y="134" width="26" height="26" rx="5" fill="#25b8ff" opacity="0.82"/>
    <path d="M90 218H176" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 242H146" stroke="#37d67a" stroke-width="8" stroke-linecap="round" opacity="0.82"/>
  </g>

  <g>
    <text x="228" y="150" fill="#f0f6fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="0">
      XuanKio
    </text>
    <text x="232" y="197" fill="url(#accent)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0">
      Game Developer in progress
    </text>
    <text x="232" y="241" fill="#b7c9e2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" letter-spacing="0">
      Unity / C# / TypeScript / JavaScript / Java
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="118" width="250" height="154" rx="22" fill="#0d1117" stroke="#243b59" stroke-width="2"/>
    <rect x="906" y="146" width="46" height="64" rx="10" fill="#f0f6fc"/>
    <rect x="964" y="146" width="46" height="64" rx="10" fill="#f0f6fc"/>
    <rect x="1022" y="146" width="46" height="64" rx="10" fill="#f0f6fc"/>
    <path d="M925 166L936 190H914L925 166Z" fill="#1f6feb"/>
    <circle cx="987" cy="178" r="12" fill="#d73a49"/>
    <rect x="1036" y="166" width="18" height="24" rx="3" fill="#37d67a"/>
    <path d="M914 235H1098" stroke="#25b8ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M914 252H1046" stroke="#37d67a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="1114" y="58" width="30" height="30" rx="6" fill="#37d67a"/>
    <rect x="1152" y="58" width="30" height="30" rx="6" fill="#25b8ff"/>
    <rect x="1190" y="58" width="30" height="30" rx="6" fill="#f6c85f"/>
    <rect x="1152" y="96" width="30" height="30" rx="6" fill="#37d67a"/>
    <rect x="80" y="276" width="22" height="22" rx="5" fill="#25b8ff" opacity="0.7"/>
    <rect x="110" y="276" width="22" height="22" rx="5" fill="#37d67a" opacity="0.7"/>
    <rect x="140" y="276" width="22" height="22" rx="5" fill="#f6c85f" opacity="0.7"/>
